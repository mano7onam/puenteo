[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "puenteo"
version = "0.11.0"
description = "Let your coding agents talk to each other: search every Claude Code / Codex / Gemini / Cursor session, message live sessions, claim files — CLI, MCP, hooks, HTTP/SSE, A2A."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mano", email = "andrey.matveev.mano@gmail.com" }]
keywords = [
  "agents",
  "multi-agent",
  "mcp",
  "a2a",
  "agent-communication",
  "claude-code",
  "codex",
  "gemini-cli",
  "cursor",
  "handoff",
  "bridge",
  "puente",
  "claude-code",
  "codex",
  "grok",
  "cli",
  "library",
  "export",
  "markdown",
  "pdf",
  "session",
  "developer-tools",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "build", "twine"]
# Rust accelerator (prebuilt abi3 wheels); puenteo is fully functional without it
fast = ["puenteo-core>=0.9.1"]

[project.urls]
Homepage = "https://github.com/mano7onam/puenteo"
Repository = "https://github.com/mano7onam/puenteo"
Issues = "https://github.com/mano7onam/puenteo/issues"
Changelog = "https://github.com/mano7onam/puenteo/releases"

[project.scripts]
puenteo = "puenteo.cli:main"
asb = "puenteo.cli:main"
pto = "puenteo.cli:main"

[tool.setuptools.packages.find]
include = ["puenteo", "puenteo.*"]

[tool.setuptools.package-data]
puenteo = ["py.typed", "data/skills/*/SKILL.md", "data/skills/*/*.md", "data/plugin/**/*"]
