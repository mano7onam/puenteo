[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "puenteo-core"
version = "0.9.1"
description = "Optional native accelerator for puenteo (Rust, PyO3). puenteo works without it."
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.maturin]
module-name = "puenteo_core._core"
python-source = "python"
features = ["pyo3/extension-module"]
