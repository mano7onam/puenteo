name: Publish to MCP Registry

# Lists puenteo in the official MCP Registry (registry.modelcontextprotocol.io)
# after the PyPI release is live. Auth: GitHub OIDC for io.github.mano7onam/*.
on:
  workflow_run:
    workflows: ["Publish to PyPI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # only this workflow; the PyPI workflow stays token-only

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Wait until the version is visible on PyPI
        run: |
          V=$(python3 -c "import json;print(json.load(open('server.json'))['version'])")
          for i in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/puenteo/$V/json" >/dev/null && exit 0
            sleep 20
          done
          echo "::error::puenteo $V not on PyPI"; exit 1
      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
