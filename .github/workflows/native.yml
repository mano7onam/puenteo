name: native

# Builds the optional Rust accelerator (puenteo-core) as abi3 wheels:
# one wheel per platform serves every Python >= 3.9.
on:
  push:
    branches: [main]
    paths: ["native/**", ".github/workflows/native.yml"]
  pull_request:
    paths: ["native/**"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-latest, target: aarch64 }
          - { os: macos-13, target: x86_64 }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: native
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - name: Equivalence tests with the native core
        if: matrix.target == 'x86_64' || matrix.target == 'x64' || (matrix.os == 'macos-latest')
        shell: bash
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install --no-index --find-links native/dist puenteo-core
          python -c "import puenteo._native as n; assert n.core, 'native core not importable'"
          python -m pytest -q tests
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: native/dist

  publish:
    if: github.event_name == 'release'
    needs: wheels
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
          skip-existing: true
