name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        shell: bash
        run: |
          python -m pytest -q -rf --tb=line 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          # surface failures as annotations (job logs need repo admin to download)
          grep -E "^(FAILED|ERROR)|Error:|assert" pytest.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
          exit $status
      - name: CLI smoke
        run: |
          puenteo --version
          puenteo status
          puenteo list -n 3
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - name: Wheel contains skills
        run: python -c "import zipfile,glob,sys; n=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); print([x for x in n if 'SKILL' in x]); sys.exit(0 if any(x.endswith('SKILL.md') for x in n) else 1)"
